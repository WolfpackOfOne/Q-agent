# Dependabot configuration for Q-agent.
#
# This enables dependency update pull requests for:
# - GitHub Actions workflows under .github/workflows/
# - Python pip requirements at the repository root
# - Python pip requirements under infrastructure/
# - Python pip requirements under infrastructure/marimo/
#
# GitHub's dependency graph can read supported package manifests directly,
# and Dependabot uses this file to open update PRs on a regular schedule.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      root-python:
        patterns: ["*"]
    ignore:
      # LEAN CLI is pinned to the course release in constraints-course.txt and
      # must match ARG LEAN_VERSION in the Dockerfile; bump both together by hand.
      - dependency-name: "lean"
      # These releases require Python >=3.12; the course still supports 3.11.
      - dependency-name: "networkx"
        versions: [">=3.7"]
      - dependency-name: "numpy"
        versions: [">=2.5"]
      - dependency-name: "scipy"
        versions: [">=1.18"]
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "pip"
    directory: "/infrastructure"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      infrastructure-python:
        patterns: ["*"]
    ignore:
      # LEAN CLI is pinned to the course release in constraints-course.txt and
      # must match ARG LEAN_VERSION in the Dockerfile; bump both together by hand.
      - dependency-name: "lean"
      # These releases require Python >=3.12; the course still supports 3.11.
      - dependency-name: "networkx"
        versions: [">=3.7"]
      - dependency-name: "numpy"
        versions: [">=2.5"]
      - dependency-name: "scipy"
        versions: [">=1.18"]
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "pip"
    directory: "/infrastructure/marimo"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      marimo-python:
        patterns: ["*"]
    ignore:
      # LEAN CLI is pinned to the course release in constraints-course.txt and
      # must match ARG LEAN_VERSION in the Dockerfile; bump both together by hand.
      - dependency-name: "lean"
      # These releases require Python >=3.12; the course still supports 3.11.
      - dependency-name: "networkx"
        versions: [">=3.7"]
      - dependency-name: "numpy"
        versions: [">=2.5"]
      - dependency-name: "scipy"
        versions: [">=1.18"]
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
