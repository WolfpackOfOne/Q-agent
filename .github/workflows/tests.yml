name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Resolve full course environment
        run: >-
          python -m pip install --dry-run --ignore-installed
          -r requirements-dev.txt
          -r infrastructure/requirements.txt
          -r infrastructure/marimo/requirements.txt

      - name: Run non-integration tests
        run: pytest -m "not integration"

  test-gate:
    name: Tests
    if: always()
    needs: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Verify test matrix
        env:
          RESULT: ${{ needs.pytest.result }}
        run: test "$RESULT" = "success"
